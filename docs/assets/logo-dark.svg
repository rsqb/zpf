<svg xmlns="http://www.w3.org/2000/svg"
     lang="en"
     width="128"
     height="128"
     viewBox="0 0 512 512"
     preserveAspectRatio="xMidYMid meet"
     shape-rendering="geometricPrecision"
     color="#BD2E41"
     role="img"
     aria-labelledby="zpf-logo-title">
    <title id="zpf-logo-title">ZPF</title>
    <defs>
        <!-- Visible faces of regular permutohedron -->
        <g id="zpf-logo-figure-faces">
            <!-- Front square -->
            <polygon id="zpf-logo-figure-face-12"
                     points="202.60,176.65 105.85,273.59 202.55,376.22 299.30,279.28"/>
            <!-- Upper-right hexagon -->
            <polygon id="zpf-logo-figure-face-1"
                     points="352.77,59.28 229.34,66.65 202.60,176.65 299.30,279.28 422.74,271.91 449.47,161.91"/>
            <!-- Lower-right hexagon -->
            <polygon id="zpf-logo-figure-face-123"
                     points="299.30,279.28 202.55,376.22 229.24,465.78 352.68,458.41 449.42,361.48 422.74,271.91"/>
            <!-- Upper-left hexagon -->
            <polygon id="zpf-logo-figure-face-124"
                     points="159.32,53.59 62.58,150.52 35.84,260.52 105.85,273.59 202.60,176.65 229.34,66.65"/>
            <!-- Lower-left hexagon -->
            <polygon id="zpf-logo-figure-face-2"
                     points="105.85,273.59 35.84,260.52 62.53,350.09 159.23,452.72 229.24,465.78 202.55,376.22"/>
            <!-- Right square -->
            <polygon id="zpf-logo-figure-face-13"
                     points="422.74,271.91 449.42,361.48 476.16,251.48 449.47,161.91"/>
            <!-- Top square -->
            <polygon id="zpf-logo-figure-face-14"
                     points="282.76,46.22 159.32,53.59 229.34,66.65 352.77,59.28"/>
        </g>
        <mask id="zpf-logo-figure-silhouette-mask">
            <use href="#zpf-logo-figure-faces" fill="#fff"/>
        </mask>
    </defs>
    <use id="zpf-logo-figure-base" href="#zpf-logo-figure-faces" fill="currentColor"/>
    <g id="zpf-logo-figure-shading" fill="#000">
        <use href="#zpf-logo-figure-face-12" fill-opacity="0.51"/>
        <use href="#zpf-logo-figure-face-123" fill-opacity="0.66"/>
        <use href="#zpf-logo-figure-face-124" fill-opacity="0.37"/>
        <use href="#zpf-logo-figure-face-2" fill-opacity="0.66"/>
        <use href="#zpf-logo-figure-face-13" fill-opacity="0.35"/>
    </g>
    <use id="zpf-logo-figure-edges"
         href="#zpf-logo-figure-faces"
         fill="none"
         stroke="#000"
         stroke-linejoin="round"
         stroke-width="2"
         mask="url(#zpf-logo-figure-silhouette-mask)"
         opacity="0.1"/>
</svg>
